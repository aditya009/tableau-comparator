bundle:
  name: data-recon-framework

# The Python wheel built from src/recon_framework is deployed and attached
# to the job defined in resources/recon_job.yml.
artifacts:
  recon_framework_wheel:
    type: whl
    build: python -m build --wheel
    path: .

include:
  - resources/*.yml

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://<your-workspace-instance>.cloud.databricks.com

  prod:
    mode: production
    workspace:
      host: https://<your-workspace-instance>.cloud.databricks.com
      root_path: /Shared/.bundle/${bundle.name}/${bundle.target}
    run_as:
      # Recommended: run production jobs as a service principal, not a user.
      service_principal_name: <your-service-principal-application-id>
